[[episode]]
key = "ep07"
number = 7
season = 1
title = "#7 Смилла – Прокурор и подвал"
description = '''<p><strong>Пророк</strong></p><p><br /></p><p>Духовной жаждою томим, </p><p>В пустыне мрачной я влачился, — </p><p>И шестикрылый серафим </p><p>На перепутье мне явился. </p><p>Перстами легкими как сон </p><p>Моих зениц коснулся он. </p><p>Отверзлись вещие зеницы, </p><p>Как у испуганной орлицы. </p><p>Моих ушей коснулся он, —  </p><p>И их наполнил шум и звон:  </p><p>И внял я неба содроганье,  </p><p>И горний ангелов полет,  </p><p>И гад морских подводный ход,  </p><p>И дольней лозы прозябанье.  </p><p>И он к устам моим приник,  </p><p>И вырвал грешный мой язык,  </p><p>И празднословный и лукавый,  </p><p>И жало мудрыя змеи  </p><p>В уста замершие мои  </p><p>Вложил десницею кровавой.  </p><p>И он мне грудь рассек мечом,  </p><p>И сердце трепетное вынул,  </p><p>И угль, пылающий огнем,  </p><p>Во грудь отверстую водвинул.  </p><p>Как труп в пустыне я лежал,  </p><p>И бога глас ко мне воззвал</p><p>«Восстань, пророк, и виждь, и внемли,  </p><p>Исполнись волею моей,  </p><p>И, обходя моря и земли,  </p><p>Глаголом жги сердца людей».</p><p><br /></p><p><br /></p><p><br /></p><p><strong>Пророк</strong></p><p><br /></p><p>С тех пор как Вечный Судия  </p><p>Мне дал всеведенье пророка,  </p><p>В очах людей читаю я  </p><p>Страницы злобы и порока.</p><p><br /></p><p>Провозглашать я стал любви  </p><p>И правды чистые ученья —  </p><p>В меня все ближние мои  </p><p>Бросали бешено каменья.</p><p><br /></p><p>Посыпал пеплом я главу,  </p><p>Из городов бежал я нищий,  </p><p>И вот в пустыне я живу,  </p><p>Как птицы, даром Божьей пищи.</p><p><br /></p><p>Завет Предвечного храня,  </p><p>Мне тварь покорна там земная.  </p><p>И звезды слушают меня,  </p><p>Лучами радостно играя.</p><p><br /></p><p>Когда же через шумный град  </p><p>Я пробираюсь торопливо,  </p><p>То старцы детям говорят  </p><p>С улыбкою самолюбивой:</p><p><br /></p><p>«Смотрите: вот пример для вас!  </p><p>Он горд был, не ужился с нами:  </p><p>Глупец, хотел уверить нас,  </p><p>Что Бог гласит его устами!</p><p><br /></p><p>Смотрите ж, дети, на него:  </p><p>Как он угрюм, и худ, и бледен!  </p><p>Смотрите, как он наг и беден,  </p><p>Как презирают все его!»</p>
'''
