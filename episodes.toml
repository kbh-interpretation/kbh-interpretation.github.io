title = "#4 Смилла – Морг и профессор"
description = '''<p>Легкие удары по стеклу заставили его взглянуть на окно. Снова пошел снег. Он сонно следил, как хлопья снега, серебряные и темные, косо летели в свете от фонаря. Настало время и ему начать свой путь к закату. Да, газеты были правы: снег шел по всей Ирландии. Он ложился повсюду — на темной центральной равнине, на лысых холмах, ложился мягко на Алленских болотах и летел дальше, к западу, мягко ложась на темные мятежные волны Шаннона. Снег шел над одиноким кладбищем на холме, где лежал Майкл Фюрей. Снег густо намело на покосившиеся кресты, на памятники, на прутья невысокой ограды, на голые кусты терна. Его душа медленно меркла под шелест снега, и снег легко ложился по всему миру, приближая последний час, ложился легко на живых и мертвых.</p>
'''
