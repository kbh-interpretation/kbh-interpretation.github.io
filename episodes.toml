description = '''[Калигула] Смотрит на Геликона. Я знаю, что ты думаешь. Столько шуму из-за смерти одной женщины. Не в этом дело. Правда, несколько дней я не мог отвязаться от мысли, что женщина, которую я любил, мертва. Но что такое любовь? Такая малость! И эта смерть - ничто, уверяю тебя. Она только знак некой правды, которая делает луну необходимой. Эта правда совсем простая и совсем ясная, немного глупая, но ее трудно открыть и тяжело выдержать. Геликон. И что ж это за правда, Кай? Калигула (отвернувшись, равнодушно). Люди умирают и они несчастны. Геликон (после паузы). Ну, Кай, с этой правдой они  научились  ладить. Погляди вокруг. Она не портит им аппетита.----Статья Рудольфа Бергаhttp://wayback-01.kb.dk/wayback/20101108105725/http://www2.kb.dk/tekster/berghtatoveringer/Alcohol in Greenland 1950-2018: consumption, drinking patterns, and consequenceshttps://www.tandfonline.com/doi/full/10.1080/22423982.2020.1814550
