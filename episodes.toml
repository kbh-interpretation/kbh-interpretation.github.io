description = '''<p>И гроб опущен уж в могилу,</p><p>И всё столпилося вокруг...</p><p>Толкутся, дышат через силу,</p><p>Спирает грудь тлетворный дух...</p><p><br /></p><p>И над могилою раскрытой,</p><p>В возглавии, где гроб стоит,</p><p>Ученый пастор сановитый</p><p>Речь погребальную гласит.</p><p><br /></p><p>Вещает бренность человечью,</p><p>Грехопаденье, кровь Христа...</p><p>И умною, пристойной речью</p><p>Толпа различно занята...</p><p><br /></p><p>А небо так нетленно-чисто,</p><p>Так беспредельно над землей...</p><p>И птицы реют голосисто</p><p>В воздушной бездне голубой...</p><p><br /></p><p>***</p><p><br /></p><p>Выпито в этом выпуске:</p><p><br /></p><p>Psychopathia Sexualis</p><p>20 ml dry gin</p><p>20 ml amontillado sherry</p><p>20 ml sweet vermouth</p><p>20 ml dry vermouth</p><p>1 dash orange bitters</p><p>Stirred</p>
